services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    volumes:
      - scala_session:/app/data
      - ./catalogo.json:/app/catalogo.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  scala_session:
